name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore NexoDesk.sln

      - name: Compilar
        run: dotnet build NexoDesk.sln -c Release --no-restore

      - name: Testar
        run: dotnet test NexoDesk.sln -c Release --no-build --logger "trx;LogFileName=resultados.trx"

      - name: Publicar o NexoDesk (self-contained, win-x64)
        run: dotnet publish src/NexoDesk.App/NexoDesk.App.csproj -c Release -r win-x64 --self-contained true -o publish/app

      - name: Gerar o instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Null
          }
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          & $iscc "/DAppVersion=$version" installer\NexoDesk.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: NexoDesk-Setup
          path: artifacts/*.exe

      - name: Publicar o instalador em Releases (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $tag = "v" + $props.Project.PropertyGroup.Version
          $setup = (Get-ChildItem artifacts/*.exe).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup --clobber
          } else {
            gh release create $tag $setup --target $env:GITHUB_SHA --title "NexoDesk $tag" `
              --notes "Instalador único do NexoDesk: o mesmo para o ADMIN e para o PC REMOTO. Passo a passo em docs/tutorial.md."
          }
