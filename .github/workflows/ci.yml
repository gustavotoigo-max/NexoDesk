name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore NexoDesk.sln

      - name: Compilar
        run: dotnet build NexoDesk.sln -c Release --no-restore

      - name: Testar
        run: dotnet test NexoDesk.sln -c Release --no-build --logger "trx;LogFileName=resultados.trx"

      - name: Publicar Admin e Agent (win-x64)
        run: |
          dotnet publish src/NexoDesk.Admin/NexoDesk.Admin.csproj -c Release -r win-x64 --self-contained false -o publish/Admin
          dotnet publish src/NexoDesk.Agent/NexoDesk.Agent.csproj -c Release -r win-x64 --self-contained false -o publish/Agent

      - uses: actions/upload-artifact@v4
        with:
          name: nexodesk-win-x64
          path: |
            publish/
            scripts/
